version: 1
scale_min: 1
scale_max: 5
weights_locked: false
weights_sign_off: pending

criteria:
  problem_fit:
    weight: 0.20
    description: >-
      How directly the proposed solution addresses the selected track's problem
      statement, required capabilities, and stated constraints. For open tracks,
      assess fit to the track's product and business brief. Do not award points
      for requirements that are merely claimed; require deck evidence.
    levels:
      1: Does not address the selected problem or misses its core requirement.
      2: Related idea, but key requirements or constraints are absent or contradicted.
      3: Addresses the core problem with partial coverage of stated requirements.
      4: Clearly addresses the problem and most required capabilities with credible detail.
      5: Direct, well-evidenced coverage of the problem, requirements, and constraints.

  novelty:
    weight: 0.15
    description: >-
      How original the idea is relative to common hackathon solutions,
      independent of track.
    levels:
      1: Derivative of a well-known demo with no meaningful twist.
      2: Familiar idea with a minor tweak that does not change the approach.
      3: Clear angle or combination that is somewhat uncommon for the problem.
      4: Distinct approach or insight that stands out among similar decks.
      5: Genuinely uncommon idea with a sharp, defensible differentiator.

  feasibility:
    weight: 0.15
    description: >-
      Whether the team can realistically build a credible version in a
      hackathon timeframe with the stated skills and scope.
    levels:
      1: Scope or dependencies make a working demo unrealistic.
      2: Major gaps in plan, skills, or timeline; high delivery risk.
      3: Achievable core demo if the team focuses; some open risks.
      4: Credible plan, suitable stack, and clear path to a working demo.
      5: Tight scope, realistic plan, and strong evidence they can ship it.

  technical_depth:
    weight: 0.20
    description: >-
      Substance of the technical design: architecture, stack choices,
      and engineering thought beyond surface UI or slides.
    levels:
      1: Almost no technical content; buzzwords without a real design.
      2: Thin stack mention; little architecture or implementation detail.
      3: Coherent stack and basic architecture with some concrete choices.
      4: Solid design with clear components, data flow, or non-trivial tech.
      5: Deep, specific engineering with trade-offs and implementation insight.

  impact:
    weight: 0.15
    description: >-
      Potential value for the stated users or problem if the project works,
      judged from the deck alone across tracks.
    levels:
      1: Problem or benefit is unclear or negligible.
      2: Narrow or weakly motivated impact; users barely defined.
      3: Plausible benefit for a real user group if it works.
      4: Clear, meaningful impact with a well-framed problem and audience.
      5: High-stakes or broad value with a compelling, well-supported case.

  evidence:
    weight: 0.15
    description: >-
      Strength of proof in the deck: demos, metrics, screenshots, or other
      artifacts that back claims (not just asserted results).
    levels:
      1: Claims with no supporting slides, demo, or artifacts.
      2: Weak or vague support; mostly assertions.
      3: Some concrete evidence (screenshot, prototype note, limited metric).
      4: Solid demo or data that meaningfully backs the main claims.
      5: Strong, specific evidence tightly linked to the claimed results.

# Use the team's declared track from its deck/profile. If it is not clear, do
# not guess a statement: score only evidence-supported fit and note ambiguity.
track_requirements:
  web_app_dev:
    aliases: ["web/app dev", "web app", "web", "app dev"]
    brief: >-
      Build a working product for a real, self-identified problem; prioritize a
      running prototype over a polished mock-up. Explain the target user,
      differentiation, monetisation/scaling path, and go-to-market route.
  open_innovation:
    aliases: ["open innovation", "open"]
    brief: >-
      Any domain or technology is eligible, but the solution should tackle a
      real problem for a target user, include a credible revenue and growth
      story, and support ambitious, unconventional thinking with a credible plan.
  game_development:
    aliases: ["game development", "game dev", "game"]
    brief: >-
      Build a playable game with a clear commercial angle, defined audience,
      believable revenue path, and broad appeal. Properly license third-party
      assets; original assets earn extra credit but are not mandatory.
  cybersecurity_rogue_ai_agents:
    aliases: ["cybersecurity", "rogue ai agents", "bank security"]
    brief: >-
      Design a security layer between AI agents and bank systems that enforces
      customer authorization and detects/stops compromised or misbehaving agents.
      Address at least two of: scoped, revocable delegation; agent identity and
      authentication; behavioural anomaly detection; human-in-the-loop escalation;
      tamper-evident audit trail.
  web3_academic_credentials:
    aliases: ["web3", "academic credentials", "credentials"]
    brief: >-
      Build a decentralised academic credential system: institutions issue
      tamper-proof credentials controlled by students; any verifier can confirm
      one instantly. Include issuance, instant QR/link verification, and
      revocation. Selective disclosure is a bonus. Use testnet only and do not
      store personal data on-chain in plaintext.
  generative_ai_foley:
    aliases: ["generative ai", "foley", "sound physics"]
    brief: >-
      From silent video or 3D animation, generate physically accurate, precisely
      timed Foley sound. Cover vision-to-audio analysis of material/environment/
      events, generative context-aware audio rather than a soundboard, frame-level
      synchronisation, and a creator UI for upload, adjustment, and export.
  agentic_ai_red_tape:
    aliases: ["agentic ai", "red tape", "bureaucracy"]
    brief: >-
      Build an autonomous legal-administrative assistant that researches current
      local regulations, obtains correct forms, interviews users for missing
      details, fills forms or portals, and presents a final transparency/review
      checkpoint for user sign-off before submission.
  edge_thermal_threat_detection:
    aliases: ["data science", "ai infra", "thermal threat", "edge"]
    brief: >-
      Build edge-optimised thermal anomaly/threat detection on resource-constrained
      hardware such as ESP32: lightweight local inference, real-time processing of
      thermal arrays, low-latency alerts/telemetry rather than raw images, and a
      central dashboard for health, threat, and log data.
